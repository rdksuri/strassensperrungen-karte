name: Prüfung Alpenpässe & Alertswiss

on:
  schedule:
    # alle 3 Stunden (8x taeglich), Minute 30 um nicht exakt mit den vielen
    # anderen Jobs auf die volle Stunde zu kollidieren
    - cron: "30 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pässe und Alertswiss prüfen
        run: python3 scripts/check_passes_and_hazards.py

      - name: Änderungen committen und pushen
        run: |
          git config user.name "strassensperrungen-karte-bot"
          git config user.email "actions@users.noreply.github.com"
          # last-check.json aendert sich (Zeitstempel) bei jedem Lauf, auch wenn
          # sich an den Sperrungen/Paessen selbst nichts geaendert hat - deshalb
          # wird hier immer committet, damit "zuletzt geprüft" auf der Karte
          # stimmt statt nur bei inhaltlichen Aenderungen.
          git add data/auto-sites.json data/last-check.json
          if ! git diff --cached --quiet; then
            git commit -m "Automatisches Update: Pass- und Alertswiss-Status"
            git push
          else
            echo "Keine Änderungen."
          fi
