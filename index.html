<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temporäre Strassensperrungen – Karte</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  #map { height: 100%; width: 100%; }

  .popup-flex { display: flex; gap: 10px; align-items: flex-start; }
  .popup-info { flex: 1; min-width: 160px; }
  .popup-minimap {
    width: 220px;
    height: 220px;
    flex-shrink: 0;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid #ccc;
    background: #eee;
  }

  /* Popup nie breiter als der Bildschirm, Inhalt scrollt statt den Screen zu sprengen.
     dvh statt vh, weil mobile Browser-Adressleisten vh sonst falsch berechnen. */
  .maplibregl-popup-content {
    max-height: 70vh;
    max-height: 70dvh;
    overflow-y: auto;
  }
  /* Groesserer Schliessen-Button als Touch-Target */
  .maplibregl-popup-close-button {
    font-size: 20px;
    padding: 6px 10px;
    line-height: 1;
  }

  /* Auf schmalen Bildschirmen (Handy): Info und Mini-Karte untereinander statt
     nebeneinander, damit nichts gequetscht wird oder abgeschnitten ist. */
  @media (max-width: 480px) {
    .popup-flex { flex-direction: column; }
    .popup-info { min-width: 0; }
    .popup-minimap { width: 100%; height: 220px; }
    .maplibregl-popup-content {
      max-height: 62vh;
      max-height: 62dvh;
    }
  }
  .popup-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .popup-row { font-size: 13px; margin: 2px 0; }
  .popup-row b { color: #333; }
  .popup-pdf-link {
    display: inline-block;
    margin-top: 8px;
    padding: 6px 10px;
    background: #d52b1e;
    color: #fff;
    text-decoration: none;
    border-radius: 4px;
    font-size: 13px;
  }
  .popup-pdf-link:hover { background: #b3241a; }
  .popup-disclaimer {
    margin-top: 8px;
    padding: 6px 8px;
    background: #f3eefc;
    border-left: 3px solid #7b3fe4;
    font-size: 11.5px;
    color: #4a2f80;
    line-height: 1.4;
  }

  /* Markante Pin-Marker */
  .site-marker {
    width: 34px;
    height: 34px;
    cursor: pointer;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.45));
    transition: transform 0.15s ease;
  }
  .site-marker:hover { transform: scale(1.15); }

  /* Kleinerer Pin in der Mini-Karte, damit Strassen und Strassennamen sichtbar bleiben */
  .site-marker.site-marker-mini {
    width: 16px;
    height: 16px;
  }

  /* Liste/Legende: Toggle-Button + ausklappbares Panel */
  .sidebar-toggle {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 5;
    background: #fff;
    border: none;
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .sidebar-toggle:hover { background: #f2f2f2; }

  .sidebar {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 340px;
    max-width: 92vw;
    background: #fff;
    box-shadow: -2px 0 10px rgba(0,0,0,0.25);
    z-index: 6;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.25s ease;
  }
  .sidebar.open { transform: translateX(0); }

  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid #e2e2e2;
    flex-shrink: 0;
  }
  .sidebar-header h2 { font-size: 15px; margin: 0; }
  .sidebar-close {
    background: none;
    border: none;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    padding: 4px 8px;
    color: #555;
  }

  .sidebar-search {
    margin: 10px 14px;
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    flex-shrink: 0;
  }

  .sidebar-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 12px;
    padding: 0 14px 10px;
    border-bottom: 1px solid #e2e2e2;
    flex-shrink: 0;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: #333; }
  .legend-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.15); }

  .sidebar-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }
  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 9px 14px;
    border: none;
    background: none;
    text-align: left;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    border-bottom: 1px solid #f0f0f0;
  }
  .sidebar-item:hover { background: #f7f7f7; }
  .sidebar-item.on-route { background: #fff6e9; }
  .sidebar-item-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .sidebar-item-name { flex: 1; }
  .sidebar-item-route-badge {
    font-size: 10px;
    font-weight: 700;
    color: #a0430a;
    background: #ffe4c2;
    padding: 1px 6px;
    border-radius: 10px;
    flex-shrink: 0;
  }
  .sidebar-empty { padding: 16px 14px; color: #777; font-size: 13px; }

  /* Routen-Check: Ziel eingeben, Standort ermitteln, Sperrungen auf dem Weg finden */
  .route-check {
    padding: 10px 14px;
    border-bottom: 1px solid #e2e2e2;
    flex-shrink: 0;
    position: relative;
  }
  .route-check label { display: block; font-size: 12px; font-weight: 600; color: #444; margin-bottom: 5px; }
  .route-input-row { display: flex; gap: 6px; }
  .route-input-row input {
    flex: 1;
    padding: 7px 9px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 13.5px;
    font-family: inherit;
    min-width: 0;
  }
  .route-input-row button {
    padding: 7px 12px;
    border: none;
    border-radius: 6px;
    background: #1c6fd6;
    color: #fff;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    flex-shrink: 0;
  }
  .route-input-row button:hover { background: #1558ab; }
  .route-suggestions {
    position: absolute;
    left: 14px;
    right: 14px;
    top: 100%;
    background: #fff;
    border: 1px solid #ccc;
    border-top: none;
    border-radius: 0 0 6px 6px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    z-index: 2;
    max-height: 220px;
    overflow-y: auto;
  }
  .route-suggestion-item {
    display: block;
    width: 100%;
    padding: 8px 10px;
    border: none;
    border-bottom: 1px solid #f0f0f0;
    background: #fff;
    text-align: left;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }
  .route-suggestion-item:last-child { border-bottom: none; }
  .route-suggestion-item:hover { background: #f2f6fc; }
  .route-status {
    margin-top: 8px;
    font-size: 12.5px;
    color: #1a6b2e;
    background: #eaf7ec;
    padding: 6px 8px;
    border-radius: 6px;
    line-height: 1.5;
  }
  .route-status-error { color: #a0430a; background: #fdeee2; }
  .route-clear-btn {
    display: inline-block;
    margin-left: 6px;
    padding: 2px 8px;
    border: 1px solid rgba(0,0,0,0.2);
    border-radius: 10px;
    background: rgba(255,255,255,0.6);
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
  }

  /* Zeigt, wann die automatischen Pass-/Alertswiss-Daten zuletzt geprueft wurden */
  .last-check {
    position: absolute;
    left: 8px;
    bottom: 4px;
    z-index: 4;
    font-size: 10.5px;
    color: #333;
    background: rgba(255,255,255,0.75);
    padding: 2px 6px;
    border-radius: 4px;
    pointer-events: none;
  }
  .last-check.stale { color: #a0430a; }

  @media (max-width: 480px) {
    .sidebar {
      top: auto;
      left: 0;
      right: 0;
      width: auto;
      max-width: none;
      height: 70vh;
      height: 70dvh;
      border-radius: 12px 12px 0 0;
      transform: translateY(100%);
    }
    .sidebar.open { transform: translateY(0); }
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="last-check" class="last-check" hidden></div>
<button id="sidebar-toggle" class="sidebar-toggle" aria-label="Liste öffnen">☰ Liste</button>
<div id="sidebar" class="sidebar">
  <div class="sidebar-header">
    <h2>Sperrungen &amp; Pässe</h2>
    <button id="sidebar-close" class="sidebar-close" aria-label="Schliessen">&times;</button>
  </div>
  <div class="route-check">
    <label for="route-destination">Wohin fährst du? (prüft Sperrungen auf der Route)</label>
    <div class="route-input-row">
      <input id="route-destination" type="text" placeholder="Ziel eingeben …" autocomplete="off" />
      <button id="route-check-btn" type="button">Prüfen</button>
    </div>
    <div id="route-suggestions" class="route-suggestions" hidden></div>
    <div id="route-status" class="route-status" hidden></div>
  </div>
  <input id="sidebar-search" class="sidebar-search" type="text" placeholder="Suchen (Ort, Name) …" />
  <div id="sidebar-legend" class="sidebar-legend"></div>
  <div id="sidebar-list" class="sidebar-list"></div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
  // Zielausschnitt: Uri (inkl. Furkapass) bis Schwyz, über Nidwalden, Obwalden und Luzern.
  // Wird per fitBounds() nach dem Laden gesetzt (nicht im Konstruktor kombiniert mit
  // maxBounds), damit unabhängig vom Seitenverhältnis der Einbettung IMMER die
  // komplette Zielfläche sichtbar ist, statt je nach Format abgeschnitten zu werden.
  const VISIBLE_BOUNDS = [
    [7.85, 46.52], // Südwest (Furkapass-Region mit Marge)
    [9.00, 47.25]  // Nordost (Kanton Schwyz)
  ];

  // Grosszügige Panning-Grenze (verhindert nur das Wegwandern nach Zürich/Basel/Tessin
  // etc.), bewusst deutlich weiter als VISIBLE_BOUNDS, damit sie die fitBounds-Zoomwahl
  // bei extremen Seitenverhältnissen (sehr breit oder sehr hoch) nicht verfälscht.
  const MAX_BOUNDS = [
    [7.0, 45.9],  // Südwest
    [9.9, 47.9]   // Nordost
  ];

  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://vectortiles.geo.admin.ch/styles/ch.swisstopo.basemap.vt/style.json', // offizielle swisstopo Basemap
    center: [8.425, 46.885],
    zoom: 9,
    minZoom: 8,
    maxZoom: 18,
    maxBounds: MAX_BOUNDS,
    dragRotate: false,       // kein versehentliches Drehen per Rechtsklick-Drag
    pitchWithRotate: false,
    touchPitch: false        // verhindert Kippen bei ungenauer Zwei-Finger-Geste am Handy
  });

  // Auf dem Handy fuehrt eine Zwei-Finger-Geste bei maplibre-gl standardmaessig auch
  // zu Rotation, was beim Pinch-Zoom schnell zu einer ungewollt schiefen Karte fuehrt.
  // Fuer diese einfache Uebersichtskarte wird Rotation komplett deaktiviert.
  map.touchZoomRotate.disableRotation();

  // fitBounds() wirkt sofort auf die Transform, unabhängig davon ob alle Kacheln
  // schon geladen sind - kein Warten auf ein load-Event nötig.
  map.fitBounds(VISIBLE_BOUNDS, { padding: 20, animate: false });

  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-left');

  // Standort-Button: zeigt die eigene Position auf der Karte (praktisch beim Fahren,
  // um zu sehen, wie nah man an einer Sperrung ist). trackUserLocation folgt der
  // Position live weiter, falls sich der Nutzer bewegt.
  map.addControl(new maplibregl.GeolocateControl({
    positionOptions: { enableHighAccuracy: true },
    trackUserLocation: true,
    showUserHeading: true
  }), 'top-left');

  // maplibre-gl zentriert Popups beim Oeffnen nicht automatisch in den sichtbaren
  // Bereich (anders als z.B. Leaflet). Gerade am Handy, wo das Popup einen grossen
  // Teil des Bildschirms einnimmt, war das Ergebnis: Teile ragen ueber den Rand
  // hinaus und man muss muehsam selbst per Hand nachschieben. Stattdessen wird die
  // Karte hier nach dem Oeffnen automatisch so verschoben, dass das komplette
  // Popup sichtbar ist.
  function panPopupIntoView(popup) {
    requestAnimationFrame(() => {
      const popupEl = popup.getElement();
      if (!popupEl) return;
      const margin = 12;
      const mapRect = map.getContainer().getBoundingClientRect();
      const popupRect = popupEl.getBoundingClientRect();
      let dx = 0;
      let dy = 0;
      if (popupRect.left < mapRect.left + margin) {
        dx = popupRect.left - (mapRect.left + margin);
      } else if (popupRect.right > mapRect.right - margin) {
        dx = popupRect.right - (mapRect.right - margin);
      }
      if (popupRect.top < mapRect.top + margin) {
        dy = popupRect.top - (mapRect.top + margin);
      } else if (popupRect.bottom > mapRect.bottom - margin) {
        dy = popupRect.bottom - (mapRect.bottom - margin);
      }
      if (dx === 0 && dy === 0) return;
      const centerPx = map.project(map.getCenter());
      const newCenter = map.unproject([centerPx.x + dx, centerPx.y + dy]);
      map.easeTo({ center: newCenter, duration: 300 });
    });
  }

  // Pin-Farbe nach Typ:
  // Totalsperrung = rot, andere Konzepte (z.B. Interventionskonzept) = orange,
  // Pass-Sperrung = blau, offener Pass = gruen, Alertswiss-Gefahrengebiet = violett
  const MARKER_COLORS = {
    totalsperrung: '#d52b1e',
    konzept: '#f2811d',
    passsperrung: '#1c6fd6',
    pass_offen: '#2e9e44',
    gefahrengebiet: '#7b3fe4'
  };

  // Fuer Legende und Sidebar: Anzeigename je Typ
  const LEGEND = [
    { typ: 'totalsperrung', label: 'Totalsperrung' },
    { typ: 'konzept', label: 'Verkehrsbehinderung / Konzept' },
    { typ: 'passsperrung', label: 'Alpenpass geschlossen' },
    { typ: 'pass_offen', label: 'Alpenpass offen' },
    { typ: 'gefahrengebiet', label: 'Alertswiss-Gefahrengebiet' }
  ];

  // Icon-Glyphen (werden in der jeweiligen Pin-Farbe auf den weissen Kreis gezeichnet)
  const ICONS = {
    // Sperrung/Barriere: fuer totalsperrung, konzept, passsperrung
    barrier: (c) => `
      <rect x="9.5" y="15.3" width="15" height="3.4" rx="1.2" fill="${c}" transform="rotate(-18 17 17)"/>
      <circle cx="10.3" cy="14.2" r="1.4" fill="${c}"/>
      <circle cx="23.7" cy="19.8" r="1.4" fill="${c}"/>
    `,
    // Feuer/Feuerverbot/Waldbrand
    flame: (c) => `
      <path fill="${c}" d="M19 8.5c-3.5 2.5-7 6-7 9.8a5 5 0 1010 0c0-2.2-1-3.8-2.2-5.2.4 1.9-.6 3.2-2 3.2-1.4 0-2.3-1.2-1.9-2.6.4-1.4 1.6-2.2 3.1-5.2z"/>
      <path fill="#ffffff" d="M18.5 15c-1.3 1.6-2.5 2.9-2.5 4.4a2.2 2.2 0 004.4 0c0-1.5-1-2.7-1.9-4.4z"/>
    `,
    // Fels-/Bergsturz, Erdrutsch, Murgang
    mountain: (c) => `
      <path fill="${c}" d="M8.5 23.5L14 13.5l3.5 5 2.7-3.3 5.8 8.3z"/>
    `,
    // Lawine / Schnee
    snowflake: (c) => `
      <g stroke="${c}" stroke-width="1.6" stroke-linecap="round">
        <line x1="17" y1="10" x2="17" y2="24"/>
        <line x1="10.9" y1="13.5" x2="23.1" y2="20.5"/>
        <line x1="10.9" y1="20.5" x2="23.1" y2="13.5"/>
      </g>
    `,
    // Hitzewelle / Trockenheit
    sun: (c) => `
      <circle cx="17" cy="17" r="3.2" fill="${c}"/>
      <g stroke="${c}" stroke-width="1.6" stroke-linecap="round">
        <line x1="17" y1="9.5" x2="17" y2="11.8"/>
        <line x1="17" y1="22.2" x2="17" y2="24.5"/>
        <line x1="9.5" y1="17" x2="11.8" y2="17"/>
        <line x1="22.2" y1="17" x2="24.5" y2="17"/>
        <line x1="12.2" y1="12.2" x2="13.7" y2="13.7"/>
        <line x1="20.3" y1="20.3" x2="21.8" y2="21.8"/>
        <line x1="12.2" y1="21.8" x2="13.7" y2="20.3"/>
        <line x1="20.3" y1="13.7" x2="21.8" y2="12.2"/>
      </g>
    `,
    // Hochwasser
    wave: (c) => `
      <path fill="none" stroke="${c}" stroke-width="1.6" stroke-linecap="round" d="M10.5 15c1.5-1.8 3-1.8 4.5 0s3 1.8 4.5 0 3-1.8 4.5 0"/>
      <path fill="none" stroke="${c}" stroke-width="1.6" stroke-linecap="round" d="M10.5 20c1.5-1.8 3-1.8 4.5 0s3 1.8 4.5 0 3-1.8 4.5 0"/>
    `,
    // Fallback fuer unbekannte/sonstige Ereignisse
    warning: (c) => `
      <text x="17" y="21.5" text-anchor="middle" font-size="12" font-weight="700" fill="${c}">!</text>
    `,
    // Haken: fuer offene Alpenpaesse
    check: (c) => `
      <path fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M10 17.5l4.5 4.5L24 12"/>
    `
  };

  // Ordnet den Alertswiss-"Ereignis"-Text einem Icon zu
  const EVENT_ICON_MAP = {
    'feuerverbot': 'flame',
    'waldbrand': 'flame',
    'divieto di accendere fuochi': 'flame',
    'trockenheit': 'sun',
    'hitzewelle': 'sun',
    'fels- und bergsturz, erdrutsch': 'mountain',
    'murgang': 'mountain',
    'lawine': 'snowflake',
    'schnee': 'snowflake',
    'hochwasser': 'wave'
  };

  // Sperrungs-Typen bekommen immer das Barriere-Icon, offene Paesse den Haken;
  // bei Alertswiss-Gefahrengebieten richtet sich das Icon nach dem gemeldeten Ereignistyp
  function getIconKey(site) {
    if (site.typ === 'pass_offen') return 'check';
    if (site.typ !== 'gefahrengebiet') return 'barrier';
    const ereignis = (site.details || []).find(d => d.label === 'Ereignis');
    const key = ereignis ? ereignis.value.trim().toLowerCase() : '';
    return EVENT_ICON_MAP[key] || 'warning';
  }

  // Ein Standort gilt als abgelaufen, wenn ein "gueltig_bis"-Datum (ISO, z.B.
  // "2026-08-14") gesetzt und dieses in der Vergangenheit liegt. Standorte
  // ohne dieses Feld (unbefristet/laufend) werden immer angezeigt.
  function isExpired(site) {
    if (!site.gueltig_bis) return false;
    const end = new Date(site.gueltig_bis + 'T23:59:59');
    return end.getTime() < Date.now();
  }

  // Markanter Pin als SVG (Warnfarbe, weisser Rand, typspezifisches Icon)
  // mini=true liefert eine verkleinerte Variante fuer die Popup-Mini-Karte
  function createMarkerElement(typ, iconKey, mini) {
    const color = MARKER_COLORS[typ] || MARKER_COLORS.konzept;
    const glyph = (ICONS[iconKey] || ICONS.warning)(color);
    const el = document.createElement('div');
    el.className = mini ? 'site-marker site-marker-mini' : 'site-marker';
    el.innerHTML = `
      <svg viewBox="0 0 34 44" xmlns="http://www.w3.org/2000/svg">
        <path d="M17 0C7.6 0 0 7.6 0 17c0 12 17 27 17 27s17-15 17-27C34 7.6 26.4 0 17 0z"
              fill="${color}" stroke="#ffffff" stroke-width="2.5"/>
        <circle cx="17" cy="17" r="7" fill="#ffffff"/>
        ${glyph}
      </svg>
    `;
    return el;
  }

  // Sidebar-Toggle (Liste & Legende)
  const sidebar = document.getElementById('sidebar');
  document.getElementById('sidebar-toggle').addEventListener('click', () => sidebar.classList.add('open'));
  document.getElementById('sidebar-close').addEventListener('click', () => sidebar.classList.remove('open'));

  // Legende einmalig aufbauen (unabhaengig von den geladenen Standorten)
  document.getElementById('sidebar-legend').innerHTML = LEGEND.map(l => `
    <span class="legend-item">
      <span class="legend-dot" style="background:${MARKER_COLORS[l.typ]}"></span>${l.label}
    </span>
  `).join('');

  // Zeitpunkt des letzten automatischen Checks (Pässe/Alertswiss) anzeigen.
  // Wird vom taeglichen GitHub-Action-Skript nach jedem Lauf neu geschrieben,
  // unabhaengig davon ob sich inhaltlich etwas geaendert hat.
  fetch('data/last-check.json')
    .then(res => res.json())
    .then(meta => {
      const el = document.getElementById('last-check');
      const checked = new Date(meta.checked_at);
      const formatted = checked.toLocaleString('de-CH', {
        day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
      });
      const stale = meta.passes_ok === false || meta.hazards_ok === false;
      el.textContent = stale
        ? `⚠ Pässe/Alertswiss zuletzt geprüft: ${formatted} (nicht alle Quellen erreichbar)`
        : `Pässe/Alertswiss zuletzt geprüft: ${formatted}`;
      el.classList.toggle('stale', stale);
      el.hidden = false;
    })
    .catch(() => { /* Datei fehlt z.B. beim allerersten Lauf noch - dann einfach nichts anzeigen */ });

  // manual-sites.json: von Hand gepflegte Standorte (aus PDFs etc.)
  // auto-sites.json: taeglich per GitHub Action aus TCS/Alertswiss generiert
  Promise.all([
    fetch('data/manual-sites.json').then(res => res.json()),
    fetch('data/auto-sites.json').then(res => res.json()).catch(() => [])
  ])
    .then(([manualSites, autoSites]) => {
      // Abgelaufene Sperrungen (gueltig_bis in der Vergangenheit) werden gar nicht
      // erst angezeigt, damit die Karte nicht mit veralteten Pins zumuellt.
      const sites = [...manualSites, ...autoSites]
        .filter(site => !isExpired(site))
        .sort((a, b) => a.name.localeCompare(b.name, 'de'));

      const entries = sites.map((site, idx) => {
        const detailRows = (site.details || [])
          .map(d => `<div class="popup-row"><b>${d.label}:</b> ${d.value}</div>`)
          .join('');
        const pdfLink = site.pdf
          ? `<a class="popup-pdf-link" href="${site.pdf}" target="_blank" rel="noopener">PDF öffnen</a>`
          : (site.link ? `<a class="popup-pdf-link" href="${site.link}" target="_blank" rel="noopener">Quelle öffnen</a>` : '');
        const disclaimer = site.typ === 'gefahrengebiet'
          ? `<div class="popup-disclaimer">⚠ Automatisch aus einem inoffiziellen Alertswiss-Feed übernommen. Keine offizielle Quelle, kann fehlerhaft sein oder ausfallen.</div>`
          : '';
        const minimapId = `popup-minimap-${idx}`;
        const popupHtml = `
          <div class="popup-flex">
            <div class="popup-info">
              <div class="popup-title">${site.name}</div>
              ${detailRows}
              ${pdfLink}
              ${disclaimer}
            </div>
            <div class="popup-minimap" id="${minimapId}"></div>
          </div>
        `;
        const popup = new maplibregl.Popup({ offset: 30, maxWidth: 'min(500px, 94vw)' }).setHTML(popupHtml);

        // Mini-Karte: wird erst beim Oeffnen des Popups erzeugt und beim Schliessen
        // wieder entfernt (begrenzte Anzahl gleichzeitiger WebGL-Kontexte im Browser).
        let miniMap = null;
        popup.on('open', () => {
          panPopupIntoView(popup);
          const container = document.getElementById(minimapId);
          if (!container) return;
          miniMap = new maplibregl.Map({
            container,
            style: 'https://vectortiles.geo.admin.ch/styles/ch.swisstopo.basemap.vt/style.json',
            center: [site.lon, site.lat],
            zoom: 16,
            interactive: false,
            attributionControl: { compact: true }
          });
          miniMap.on('load', () => {
            miniMap.resize();
            // Strassennamen werden vom Basemap-Style standardmaessig nur gezeigt, wenn
            // genug Platz neben Kachel-/Kartenraendern ist - in der kleinen Mini-Karte
            // unterdrueckt das sonst gerade die Namen der Strassen, um die es hier geht.
            // Ausserdem etwas groesser/deutlicher darstellen als im Original-Style.
            try {
              miniMap.setLayoutProperty('transportation_label', 'symbol-avoid-edges', false);
              miniMap.setLayoutProperty('transportation_label', 'text-size', 15);
            } catch (e) { /* Layer-Name koennte sich mit kuenftigen Style-Versionen aendern */ }
            new maplibregl.Marker({ element: createMarkerElement(site.typ, getIconKey(site), true), anchor: 'bottom' })
              .setLngLat([site.lon, site.lat])
              .addTo(miniMap);
          });
        });
        popup.on('close', () => {
          if (miniMap) {
            miniMap.remove();
            miniMap = null;
          }
        });

        const marker = new maplibregl.Marker({ element: createMarkerElement(site.typ, getIconKey(site)), anchor: 'bottom' })
          .setLngLat([site.lon, site.lat])
          .setPopup(popup);

        return { site, marker, onMap: false };
      });

      function setOnMap(entry, on) {
        if (on === entry.onMap) return;
        if (on) entry.marker.addTo(map); else entry.marker.remove();
        entry.onMap = on;
      }

      function openEntry(entry) {
        map.easeTo({ center: [entry.site.lon, entry.site.lat], zoom: Math.max(map.getZoom(), 13), duration: 500 });
        entry.marker.togglePopup();
        if (window.matchMedia('(max-width: 480px)').matches) sidebar.classList.remove('open');
      }

      // Baut die Liste im Sidebar-Panel neu auf und blendet Marker auf der Karte
      // ein/aus, je nachdem ob sie zum Suchbegriff passen (Name oder "Ort"-Detail).
      // Eintraege, die per Routen-Check als relevant markiert wurden (entry.onRoute),
      // erscheinen zuerst und mit einem Badge.
      const listEl = document.getElementById('sidebar-list');
      function renderList(filterText) {
        const q = filterText.trim().toLowerCase();
        listEl.innerHTML = '';
        let shown = 0;
        const sorted = entries.slice().sort((a, b) => (b.onRoute ? 1 : 0) - (a.onRoute ? 1 : 0));
        sorted.forEach(entry => {
          const ortDetail = (entry.site.details || []).find(d => d.label === 'Ort');
          const haystack = (entry.site.name + ' ' + (ortDetail ? ortDetail.value : '')).toLowerCase();
          const matches = !q || haystack.includes(q);
          setOnMap(entry, matches);
          if (!matches) return;
          shown++;
          const btn = document.createElement('button');
          btn.className = entry.onRoute ? 'sidebar-item on-route' : 'sidebar-item';
          btn.innerHTML = `
            <span class="sidebar-item-dot" style="background:${MARKER_COLORS[entry.site.typ] || MARKER_COLORS.konzept}"></span>
            <span class="sidebar-item-name">${entry.site.name}</span>
            ${entry.onRoute ? '<span class="sidebar-item-route-badge">auf Route</span>' : ''}
          `;
          btn.addEventListener('click', () => openEntry(entry));
          listEl.appendChild(btn);
        });
        if (shown === 0) {
          const empty = document.createElement('div');
          empty.className = 'sidebar-empty';
          empty.textContent = 'Keine Treffer.';
          listEl.appendChild(empty);
        }
      }

      renderList('');
      document.getElementById('sidebar-search').addEventListener('input', (e) => renderList(e.target.value));

      // --- Routen-Check: Ziel eingeben, aktuellen Standort holen, Route berechnen
      // und pruefen, welche Sperrungen in der Naehe der Route liegen. ---

      const ROUTE_RELEVANCE_METERS = 400;
      let currentDestination = null; // { lat, lon, label }
      let routeLayerAdded = false;

      function ensureRouteLayer() {
        if (routeLayerAdded) return;
        map.addSource('route-line', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
        map.addLayer({
          id: 'route-line-layer',
          type: 'line',
          source: 'route-line',
          layout: { 'line-join': 'round', 'line-cap': 'round' },
          paint: { 'line-color': '#1c6fd6', 'line-width': 5, 'line-opacity': 0.65 }
        });
        routeLayerAdded = true;
      }

      function setRouteGeometry(coordinates) {
        ensureRouteLayer();
        map.getSource('route-line').setData({
          type: 'Feature',
          geometry: { type: 'LineString', coordinates }
        });
      }

      // Abstand Punkt-zu-Streckensegment in Metern, ueber eine lokale Ebenen-
      // Naeherung (Grad -> Meter mit Breitengrad-Korrektur). Fuer die kurzen
      // Distanzen hier (ein paar hundert Meter) mehr als genau genug.
      function pointToSegmentMeters(plat, plon, alat, alon, blat, blon) {
        const mPerDegLat = 111320;
        const mPerDegLon = 111320 * Math.cos(alat * Math.PI / 180);
        const bx = (blon - alon) * mPerDegLon, by = (blat - alat) * mPerDegLat;
        const px = (plon - alon) * mPerDegLon, py = (plat - alat) * mPerDegLat;
        const lenSq = bx * bx + by * by;
        let t = lenSq === 0 ? 0 : (px * bx + py * by) / lenSq;
        t = Math.max(0, Math.min(1, t));
        const dx = px - t * bx, dy = py - t * by;
        return Math.sqrt(dx * dx + dy * dy);
      }

      function distanceToRoute(lat, lon, coords) {
        let min = Infinity;
        for (let i = 0; i < coords.length - 1; i++) {
          const [lon1, lat1] = coords[i];
          const [lon2, lat2] = coords[i + 1];
          const d = pointToSegmentMeters(lat, lon, lat1, lon1, lat2, lon2);
          if (d < min) min = d;
        }
        return min;
      }

      function clearRoute() {
        currentDestination = null;
        destInput.value = '';
        if (routeLayerAdded) map.getSource('route-line').setData({ type: 'FeatureCollection', features: [] });
        entries.forEach(entry => { entry.onRoute = false; });
        routeStatusEl.hidden = true;
        routeStatusEl.textContent = '';
        renderList(document.getElementById('sidebar-search').value);
      }

      function showRouteStatus(html, isError) {
        routeStatusEl.hidden = false;
        routeStatusEl.className = isError ? 'route-status route-status-error' : 'route-status';
        routeStatusEl.innerHTML = html;
      }

      function checkRoute() {
        if (!currentDestination) {
          showRouteStatus('Bitte zuerst ein Ziel aus den Vorschlägen auswählen.', true);
          return;
        }
        showRouteStatus('Standort wird ermittelt …', false);
        navigator.geolocation.getCurrentPosition((pos) => {
          const originLat = pos.coords.latitude;
          const originLon = pos.coords.longitude;
          showRouteStatus('Route wird berechnet …', false);
          const url = `https://router.project-osrm.org/route/v1/driving/${originLon},${originLat};${currentDestination.lon},${currentDestination.lat}?overview=full&geometries=geojson`;
          fetch(url)
            .then(res => res.json())
            .then(data => {
              if (data.code !== 'Ok' || !data.routes || !data.routes.length) throw new Error('keine Route');
              const coords = data.routes[0].geometry.coordinates;
              setRouteGeometry(coords);

              let count = 0;
              entries.forEach(entry => {
                entry.onRoute = distanceToRoute(entry.site.lat, entry.site.lon, coords) <= ROUTE_RELEVANCE_METERS;
                if (entry.onRoute) count++;
              });

              const label = currentDestination.label;
              const msg = count > 0
                ? `⚠ ${count} Sperrung${count === 1 ? '' : 'en'} auf deiner Route nach „${label}“`
                : `✓ Keine Sperrungen auf deiner Route nach „${label}“ gefunden`;
              showRouteStatus(`${msg} <button id="route-clear" class="route-clear-btn" type="button">Route zurücksetzen</button>`, false);
              document.getElementById('route-clear').addEventListener('click', clearRoute);

              const lons = coords.map(c => c[0]);
              const lats = coords.map(c => c[1]);
              map.fitBounds([[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]], { padding: 60, duration: 500 });
              sidebar.classList.add('open');

              renderList(document.getElementById('sidebar-search').value);
            })
            .catch(() => {
              showRouteStatus('Route konnte nicht berechnet werden (Dienst nicht erreichbar oder keine Verbindung gefunden).', true);
            });
        }, () => {
          showRouteStatus('Standort konnte nicht ermittelt werden (Berechtigung erteilt?).', true);
        }, { enableHighAccuracy: true, timeout: 15000 });
      }

      const destInput = document.getElementById('route-destination');
      const suggestEl = document.getElementById('route-suggestions');
      const routeStatusEl = document.getElementById('route-status');
      let suggestTimeout = null;

      destInput.addEventListener('input', () => {
        currentDestination = null;
        const q = destInput.value.trim();
        clearTimeout(suggestTimeout);
        if (q.length < 3) {
          suggestEl.hidden = true;
          suggestEl.innerHTML = '';
          return;
        }
        suggestTimeout = setTimeout(() => {
          fetch(`https://api3.geo.admin.ch/rest/services/api/SearchServer?searchText=${encodeURIComponent(q)}&type=locations&sr=4326&limit=8`)
            .then(res => res.json())
            .then(data => {
              const results = data.results || [];
              if (!results.length) {
                suggestEl.hidden = true;
                suggestEl.innerHTML = '';
                return;
              }
              suggestEl.innerHTML = '';
              results.forEach(r => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'route-suggestion-item';
                btn.textContent = r.attrs.label.replace(/<[^>]+>/g, '');
                btn.addEventListener('click', () => {
                  currentDestination = { lat: r.attrs.lat, lon: r.attrs.lon, label: btn.textContent };
                  destInput.value = btn.textContent;
                  suggestEl.hidden = true;
                  suggestEl.innerHTML = '';
                  checkRoute();
                });
                suggestEl.appendChild(btn);
              });
              suggestEl.hidden = false;
            })
            .catch(() => { suggestEl.hidden = true; });
        }, 300);
      });
      destInput.addEventListener('blur', () => {
        // Verzoegert schliessen, damit ein Klick auf einen Vorschlag noch ankommt.
        setTimeout(() => { suggestEl.hidden = true; }, 150);
      });

      document.getElementById('route-check-btn').addEventListener('click', () => checkRoute());
    })
    .catch(err => console.error('Fehler beim Laden der Standorte:', err));
</script>
</body>
</html>
